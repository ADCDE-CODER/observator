<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Company</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navigation">
        <div class="container">
            <div class="navigation-header">
                <a class="header-logo" href="">
                    <img src="logo.png" alt="">
                </a>
            </div>
            <div class="navigation-main">
                <nav>
                    <ul class="main-menu">
                        <li><a href="">Chat</a></li>
                        <li><a href="">Image</a></li>
                        <li><a href="">Video</a></li>
                        <li><a href="">Post</a></li>
                    </ul>
                </nav>
                <div class="main-profile">
                    <img src="" alt="">
                    <button>Sign in</button>
                </div>
            </div>
        </div>
    </header>

    <main class="content">
        <aside class="content-history">
            <nav class="history-navigation">
                <ul>
                    <li><a href=""></a></li>
                </ul>
            </nav>
        </aside>
        <div class="content-main">
            <section class="main-page" id="chat">
                <h2>Chat</h2>
                <p id="output"></p>
                <input type="text" placeholder="Type here">
                <button>Send</button>
            </section>
            <section class="main-page" id="image">
                <h2>Image</h2>
            </section>
            <section class="main-page" id="video">
                <h2>Video</h2>
            </section>
            <section class="main-page" id="post">
                <h2>Post</h2>
            </section>
        </div>
        <form class="content-settings" action="" method="POST">
            <label for="max-tokens">Max Tokens:</label>
            <input id="max-tokens" type="text" value="20" name="max-tokens">
            <button type="submit">Apply</button>
        </form>
    </main>

</body>
</html>
