<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Company</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="nav-header">
        <div class="nav-header__logo">
            <a href=""> <img src="logo.png" alt="logo image"> </a>
        </div>
        <div class="nav-header__content">
            <nav class="nav-header__menu">
                <ul>
                    <li><a href="">Chat</a></li>
                    <li><a href="">Image</a></li>
                    <li><a href="">Video</a></li>
                    <li><a href="">Post</a></li>
                </ul>
            </nav>
            <div class="nav-header__profile">
                <img src="profile.png" alt="">
                <button>Sign in</button>
            </div>
        </div>
    </header>

    <main class="content-main">
        <section class="content-main__page" id="chat">
            <div class="content-main__history">
                <h2>History</h2>
                <aside>
                    <nav class="content-main__menu">
                        <ul>
                            <li><a href=""></a>History</li>
                            <li><a href=""></a>History</li>
                            <li><a href=""></a>History</li>
                            <li><a href=""></a>History</li>
                        </ul>
                    </nav>
                </aside>
            </div>
            <div class="content-main__chat">
                <h2>Chat</h2>
                <div class="content-main__output"></div>
                <div class="content-main__button">
                    <input type="text" placeholder="Type here">
                    <button>Send</button>
                </div>
            </div>
            <div class="content-main__settings">
                <h2>Settings</h2>
                <form action="" method="POST">
                    <div class="content-main__label">
                        <label for="max-tokens">Max Tokens:</label>
                        <input id="max-tokens" type="text" value="20" name="max-tokens">
                    </div>
                    <button type="submit">Apply</button>
                </form>
            </div>
        </section>
        <section class="content-main__page" id="image">
            <h2>Image</h2>
        </section>
        <section class="content-main__page" id="video">
            <h2>Video</h2>
        </section>
        <section class="content-main__page" id="post">
            <h2>Post</h2>
        </section>
    </main>

</body>
</html>
