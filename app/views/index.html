<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Company</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="nav-header">
        <div id="nav-header__logo">
            <img src="logo.png" alt="logo image">
        </div>
        <div class="nav-header__content">
            <nav class="nav-header__menu">
                <ul>
                    <li><a href="">Chat</a></li>
                    <li><a href="">Image</a></li>
                    <li><a href="">Video</a></li>
                    <li><a href="">Post</a></li>
                </ul>
            </nav>
            <div class="nav-header__profile">
                <img src="profile.png" alt="">
                <button id="loginMenu-button">Login menu</button>
            </div>
        </div>
    </header>

    <div id="login-content">
        <div class="login-content__label">
            <label for="email">Email:</label>
            <input id="email" type="text" name="email">
        </div>
        <div class="login-content__label">
            <label for="password">Password:</label>
            <input id="password" type="text" name="password">
        </div>
        <button id="login">Login</button>
    </div>

    <main id="content-main">
        <section class="content-main__page" id="chat">
            <div class="content-main__chats">
                <h2>Chats</h2>
                <aside>
                    <button id="chat-button">New chat</button>
                    <nav class="content-main__menu">
                        <ul id="content-main__menuContent"></ul>
                    </nav>
                </aside>
            </div>
            <div class="content-main__chat">
                <h2>Chat</h2>
                <div class="content-main__output"></div>
                <div class="content-main__button">
                    <input id="prompt-input" type="text" placeholder="Type here">
                    <button id="send-button">Send</button>
                </div>
            </div>
            <div class="content-main__settings">
                <h2>Settings</h2>
                <form action="" method="POST">
                    <div class="content-main__label">
                        <label for="max-tokens">Max Tokens:</label>
                        <input id="max-tokens" type="text" value="20" name="max-tokens">
                    </div>
                    <button type="submit">Apply</button>
                </form>
            </div>
        </section>
        <section class="content-main__page" id="image">
            <h2>Image</h2>
        </section>
        <section class="content-main__page" id="video">
            <h2>Video</h2>
        </section>
        <section class="content-main__page" id="post">
            <h2>Post</h2>
        </section>
    </main>
    <script src="index.js"></script>
</body>
</html>
