<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Company</title>
    <link rel="stylesheet" href="../public/styles.css">
    <script defer src="../public/index.js"></script>
</head>
<body onload="showPage('welcome', true)">

    <header id="nav-header">
        <div id="nav-header__logo">
            <img src="../public/logo.png" alt="logo image">
        </div>
        <div class="nav-header__content">
            <nav id="nav-header__menu">
                <ul>
                    <li><a href="#chat">Chat</a></li>
                    <li><a href="#image">Image</a></li>
                    <li><a href="#video">Video</a></li>
                    <li><a href="#post">Post</a></li>
                </ul>
            </nav>
            <div id="nav-header__profile">
                <img src="../public/profile.png" alt="">
            </div>
            <button id="loginMenu-button">Log in</button>
            <button id="logoutMenu-button">Log out</button>
        </div>
    </header>

    <main id="content-main">
        <section class="content-main__page" id="welcome">
            <h2>Welcome to the Company</h2>
        </section>
        <section class="content-main__page" id="sign-menu">
            <div class="card">
                <h2>Enter your information</h2>
                <section class="menu">
                    <h2>Sign up</h2>
                    <div class="menu__label">
                        <label for="create-email">Email:</label>
                        <input id="create-email" type="text" name="create-email" placeholder="Email">
                    </div>
                    <div class="menu__label">
                        <label for="create-password">Password:</label>
                        <input id="create-password" type="text" name="create-password" placeholder="Password">
                    </div>
                    <button id="signup-button" type="button">Sign up</button>
                </section>
                <section class="menu">
                    <h2>Sign in</h2>
                    <div class="menu__label">
                        <label for="read-email">Email:</label>
                        <input id="read-email" type="text" name="read-email" placeholder="Email">
                    </div>
                    <div class="menu__label">
                        <label for="read-password">Password:</label>
                        <input id="read-password" type="text" name="read-password" placeholder="Password">
                    </div>
                    <button id="signin-button" type="button">Sign in</button>
                </section>
            </div>
        </section>
        <section class="content-main__page" id="chat">
            <div class="content-main__chats">
                <h2>Chats</h2>
                <button id="chat-button">New chat</button>
                <aside id="content-main__menuContent"></aside>
            </div>
            <div class="content-main__chat">
                <h2>Chat</h2>
                <div id="content-main__output"></div>
                <div class="content-main__button">
                    <input id="prompt-input" type="text" placeholder="Type here">
                    <button id="send-button">Send</button>
                </div>
            </div>
            <div class="content-main__settings">
                <h2>Settings</h2>
                <form id="chat-form__settings">
                    <div class="content-main__label">
                        <h3>Reasoning</h3>
                        <label for="effort">Effort:</label>
                        <input id="effort" type="text" name="effort">

                        <label for="reasoning-max-tokens">Max tokens:</label>
                        <input id="reasoning-max-tokens" type="number" name="reasoning_max_tokens">

                        <label for="exclude">Exclude:</label>
                        <input id="exclude" type="checkbox" name="exclude">
                    </div>
                    <div class="content-main__label">
                        <h3>Usage</h3>
                        <label for="include">Include:</label>
                        <input id="include" type="checkbox" name="include">
                    </div>
                    <h3>Generally</h3>
                    <div class="content-main__label">
                        <label for="stream">Stream:</label>
                        <input id="stream" type="checkbox" name="stream">
                    </div>
                    <div class="content-main__label">
                        <label for="max-tokens">Max tokens:</label>
                        <input id="max-tokens" type="number" name="max_tokens">
                    </div>
                    <div class="content-main__label">
                        <label for="temperature">Temperature:</label>
                        <input id="temperature" type="number" name="temperature">
                    </div>
                    <div class="content-main__label">
                        <label for="seed">Seed:</label>
                        <input id="seed" type="number" name="seed">
                    </div>
                    <div class="content-main__label">
                        <label for="top-p">Top-p:</label>
                        <input id="top-p" type="number" name="top_p">
                    </div>
                    <div class="content-main__label">
                        <label for="top-k">Top-k:</label>
                        <input id="top-k" type="number" name="top_k">
                    </div>
                    <div class="content-main__label">
                        <label for="frequency-penalty">Frequency penalty:</label>
                        <input id="frequency-penalty" type="number" name="frequency_penalty">
                    </div>
                    <div class="content-main__label">
                        <label for="presence-penalty">Presence penalty:</label>
                        <input id="presence-penalty" type="number" name="presence_penalty">
                    </div>
                    <div class="content-main__label">
                        <label for="repetition-penalty">Repetition penalty:</label>
                        <input id="repetition-penalty" type="number" name="repetition_penalty">
                    </div>
                    <div class="content-main__label">
                        <label for="logit-bias">Logit bias:</label>
                        <input id="logit-bias" type="text" name="logit_bias">
                    </div>
                    <button type="submit">Apply</button>
                </form>
            </div>
        </section>
        <section class="content-main__page" id="image">
            <h2>Image</h2>
        </section>
        <section class="content-main__page" id="video">
            <h2>Video</h2>
        </section>
        <section class="content-main__page" id="post">
            <h2>Post</h2>
        </section>
    </main>
</body>
</html>
